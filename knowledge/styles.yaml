# ============================================================================
# 风格库（单一事实源 · 宪章 11.1-K1）
# ----------------------------------------------------------------------------
# 风格域词条：进入《模块化特征簇标记语法》提示词时，归入「光影氛围」簇的
# 抽象类（权重上限 0.8，见规范 3.2 风格域数量法则 / 3.5 权重梯度）。
# 本文件覆盖 lexicon.yaml style_domain_terms 的全部 15 个词条并扩展。
#
# 字段说明：
#   id         : 稳定标识（SSOT 契约 2：发布后不得改写含义）
#   term       : 主词条
#   aliases    : 别名 / 英文写法
#   markers    : 该风格的代表性视觉标记（供语义场关联与扩充建议）
#   conflicts  : 气质互斥的风格 id
#   fcs_hint   : 进入特征簇提示词时的映射建议
#   source     : 来源（11.1-K2）
#   confidence: 高 / 中 / 低（11.1-K2）
#   sensitivity/permission : 安全元数据，缺省 公开/可输出（11.4-M1）
# ============================================================================

version: 1

meta:
  updated: "2026-10"
  source: 公开艺术史与网络美学资料整理；与 lexicon.yaml style_domain_terms 对齐
  note: >
    风格域在提示词中只作气质约束，不承担画面主干；多个风格域并存会触发
    fcslint FCS006（风格域数量法则）与 5.4 控制力扣分。

kinds:
  style: {zh: 风格域, fcs_cluster: light, fcs_kind: abstract, weight_max: 0.8}

