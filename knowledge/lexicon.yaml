# ============================================================================
# 特征簇词条知识库（单一事实源 · 宪章 11.1-K1）
# ----------------------------------------------------------------------------
# 支撑 fcslint 的规则判定与评分，同时是语义场引擎（collab_charter.lexicon）
# 的语料来源。数据来源：
#   《模块化特征簇标记语法》2.1 六大功能簇 / 2.3 词条类型学 / 6.1 媒介链路溯源
#   + 附录 A 三个案例的全部词条
#   + cognitive-core v3.1 references/style-library.md 的风格维度
#
# 字段说明：
#   cluster : 六大功能簇之一（subject/render/color/medium/distortion/light）
#   kind    : entity 实体视觉 / abstract 抽象概念 / tech 技术参数
#   mapping : high 高映射 / mid 中映射 / low 低映射
#   chain   : 媒介链路环节（draw/digitize/display/archive），无则离链
#   invalid : true 表示该词条被规范显式禁止（如 seed 破坏可复现性）
#
# 语义场扩展字段（均可选，缺省时由 collab_charter.lexicon.kb 补默认值）：
#   id        : 稳定标识，缺省由 term 生成；一经发布不得改写（SSOT 契约 2）
#   aliases   : 别名/英文写法，检索与向量特征都算
#   domain    : 语义域标签列表，如 [ACG, 影像, 2000s]
#   era       : 时代标签，如 2000s / 2010s
#   tags      : 自由标签，参与语义场关联边
#   related   : 关联条目 id 列表（显式关联边）
#   conflicts : 冲突条目 id 列表（显式冲突边，断边）
#   source    : 来源（11.1-K2 要求）
#   confidence: 高 / 中 / 低（11.1-K2 要求）
#   sensitivity/permission : 安全元数据，缺省 公开/可输出（11.4-M1）
# ============================================================================

version: 1

meta:
  updated: "2026-10"
  source: 《模块化特征簇标记语法》2.1 六大功能簇 / 2.3 词条类型学 / 6.1 媒介链路溯源 + 附录 A 三个案例的全部词条 + cognitive-core v3.1 references/style-library.md 的风格维度
  confidence: 高
  note: 条目级 source/confidence 缺失时回退到本文件级来源（11.1-K2）。

clusters:
  subject:    { zh: 主体实体, order: 1, desc: 画面主体与构图取景，置于最前 }
  render:     { zh: 原生绘制, order: 2, desc: 绘制技法与美术属性 }
  color:      { zh: 色彩系统, order: 3, desc: 色深、抖动、套印与调色 }
  medium:     { zh: 媒介采集, order: 4, desc: 采集—输出—存档链路上的痕迹 }
  distortion: { zh: 畸变图层, order: 5, desc: 损伤失真与图层结构 }
  light:      { zh: 光影氛围, order: 6, desc: 光影、氛围与画幅，置于末尾 }

kinds:
  entity:   { zh: 实体视觉, mapping_hint: high, weight_max: 1.4, desc: 直接对应可成像特征，承担画面主干 }
  abstract: { zh: 抽象概念, mapping_hint: low,  weight_max: 0.99, desc: 视觉映射弱，仅作气质约束 }
  tech:     { zh: 技术参数, mapping_hint: high, weight_max: 1.4, desc: 画幅比例等确定性约束 }

