# ---------------------------------------------------------------------------
# 直接语义冲突对（8.3 冲突判定规则）：字面含义互斥，必须删除其一
# ---------------------------------------------------------------------------
direct_conflicts:
  - {a: 颗粒感, b: 禁噪点, clause: "8.3", note: 一手要颗粒、一手禁噪点，字面互斥}
  - {a: 噪点, b: 禁噪点, clause: "8.3", note: 同上}
  - {a: 模糊, b: 极度清晰, clause: "8.3", note: 清晰度要求互斥}
  - {a: 模糊, b: 清晰, clause: "8.3", note: 清晰度要求互斥}
  - {a: 极低分辨率, b: 超高清晰, clause: "8.3", note: 分辨率要求互斥}
  - {a: 禁止全图模糊, b: 有点模糊, clause: "8.3", note: 规范案例三显式禁止项被违反}
  - {a: 无情绪, b: 情绪浓烈, clause: "8.3", note: 情绪指令互斥}

# ---------------------------------------------------------------------------
# 跨域逻辑冲突（8.3）：各自合理但来自两套独立影像体系，标记为可控风险
# ---------------------------------------------------------------------------
cross_domain_conflicts:
  - {a: 胶片, b: 录像, clause: "8.3", note: 胶片链路与模拟磁带录像链路异源}
  - {a: Agfacolor, b: Hi8, clause: "8.3", note: 规范案例二指出的典型异源组合}
  - {a: 抠图伪影, b: 相机采集, clause: "8.3", note: 素材导出痕迹与相机采集痕迹不共存}
  - {a: 舞台化, b: 偷拍, clause: "8.3", note: 观看机制矛盾}
  - {a: 数码, b: 胶片, clause: "8.3", note: 数字与模拟链路异源}

# ---------------------------------------------------------------------------
# 媒介链路环节（6.1 媒介链路溯源法）
# ---------------------------------------------------------------------------
chain_stages:
  draw:     {zh: 创作/绘制, desc: 绘制技法、美术属性}
  digitize: {zh: 数字化采集, desc: 扫描、索引色、抖动}
  display:  {zh: 硬件输出显示, desc: CRT、屏摄、扫描线}
  archive:  {zh: 转录/截图/压缩存档, desc: 压缩、伪影、截图}

# ---------------------------------------------------------------------------
# 权重梯度参考（3.5 / 9.1）
# ---------------------------------------------------------------------------
weight_gradient:
  subject:    {min: 1.2, max: 1.4}
  render:     {min: 1.1, max: 1.3}
  color:      {min: 1.1, max: 1.3}
  medium:     {min: 0.8, max: 1.1}
  distortion: {min: 0.8, max: 1.1}
  light:      {min: 0.5, max: 0.8}
global_weight_range: {min: 0.5, max: 1.4}

# ---------------------------------------------------------------------------
# 评分权重（5.4 控制力量化：四项加权）
# ---------------------------------------------------------------------------
scoring:
  anchor_strength: 0.35   # 主体锚定强度
  conflict_penalty: 0.25  # 冲突数量
  abstract_ratio: 0.20    # 抽象词条占比
  high_mapping_ratio: 0.20  # 高映射词条占比
  style_domain: 0.0       # 风格域数量（附加扣分项，见 rules）

