# 该词是为了「识别」，不是为了「外发」。
#
# 字段说明：
#   gloss      : 释义（条目定义性内容，引用时以来源为准，见 11.3-F3）
#   register   : 色彩（褒义/贬义/中性/调侃）
#   era        : 通行年代
#   platforms  : 主要通行平台
#   fcs_hint   : 进入特征簇提示词时的映射建议
#   source     : 来源（11.1-K2）
#   confidence: 高 / 中 / 低（11.1-K2）
# ============================================================================

