# ----------------------------------------------------------------------------
# 供特征簇标记语法扩容与语义场深挖使用。五类条目：
#   meme      网络迷因（梗）：有明确出处的病毒式内容
#   slang     流行语/黑话：词汇层面的网络用法
#   register  语体/语料体裁：成篇的语言风格（可直接进「语料」维度）
#   community 圈层文化：社区与圈子本身
#   practice  圈层实践：圈内的行为模式
#
# 安全元数据示例：涉及隐私侵害的条目（开盒/人肉搜索）标 高危/禁外发，
